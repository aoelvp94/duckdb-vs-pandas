name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Prueba de humo: datos chicos, una corrida. Valida que los 3 pipelines
      # corran y den resultados idénticos (el benchmark falla si difieren).
      - run: python generate_data.py --rows 200_000
      - run: python benchmark.py --rows 200_000 --repeat 1
